<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Example</title>
  <!--Link to external file -->
  <link rel="stylesheet" href="Portfolio/main.css">
 <link rel="stylesheet" href="form-with-js.css">
  <script src="Portfolio/theme.js" defer></script>

 
</head>
<body>
  <header>
    <h1>Form Example</h1>
    <button type="button" id="theme-toggle" hidden>Switch to dark theme</button>
  </header>

  <main>
    <form action="https://httpbin.org/post" method="post">
      <label for="name" >Name: (required)</label>
      <input type="text" id="name" name="name"  autocomplete="name" aria-describedby="name-error" minlength="1" maxlength="100" required>
       

      <label for="email" >Email: (required)</label>
      <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error" required>
        

      <label for="comments">Comments: (required)</label>
      <p id="comment-instructions">Enter 10 to 1000 characters</p>
      <textarea id="comments" name="comments" aria-describedby="comment-instructions comments-error char-count" minlength="10" maxlength="1000" required></textarea>
     

      <input type="hidden" name="possible_bot" value="true">
      <input type="hidden" id="form-errors" name="form-errors" value="">

    <section id="error-area" aria-live="polite">
        <p id="name-error" class="error"></p>
        <p id="email-error" class="error"></p>
        <p id="comments-error" class="error"></p>
    </section>

    <section id="info-area" hidden>
      <p id="char-count"></p>
    </section>



      <button type="submit">Submit</button>
    </form>
  </main>
   <script src="form.js" defer></script>
</body>
</html>
